name: Build iOS IPA
on:
  workflow_dispatch:
  
jobs:
  build-ios:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      #签出代码
      - uses: actions/checkout@v4
        with:
          ref: master        
      #检查版本
      - name: Check full build environment
        run: |
          echo "=== System ==="
          sw_vers
          
          echo "=== Xcode ==="
          xcodebuild -version
          echo "Path: $(xcode-select -p)"
          
          echo "=== Available Xcodes ==="
          ls -la /Applications/ | grep -i xcode
          
          echo "=== iOS SDKs ==="
          xcodebuild -showsdks | grep -E "ios|iphoneos"
          
          echo "=== Swift version ==="
          swift --version
          
          echo "=== CocoaPods ==="
          pod --version
    
      #设置Flutter
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      #更新Flutter的packages
      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get
      # 安装appdmg npm install -g appdmg
      - name: Install appdmg
        run: npm install -g appdmg

      # 设置flutter_distributor环境
      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      #打包iOS
      - name: Build IPA
        run: |
          cd simple_live_app
          flutter build ios --release --no-codesign
      #创建未签名ipa
      - name: Create IPA
        run: |
          cd simple_live_app
          mkdir build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos/
          zip -q -r ios_no_sign.ipa Payload
          cd ../../..
      #上传IPA至Artifacts
      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: |
            simple_live_app/build/ios/iphoneos/ios_no_sign.ipa
      #完成
      - run: echo "🍏 This job's status is ${{ job.status }}."
